schema_version: 1

context:
  name: furl
  version: "2.1.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 877657501266c929269739fb5f5980534a41abd6bbabcb367c136d1d3b2a6015

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - six >=1.8.0
    - orderedmultidict >=1.0

tests:
  - python:
      imports:
        - furl
      pip_check: true
      python_version: ${{ python_min }}

about:
  license_file: LICENSE.md
  license: Unlicense
  summary: URL manipulation made simple.
  homepage: https://github.com/gruns/furl
  repository: https://github.com/gruns/furl
  documentation: https://github.com/gruns/furl

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
